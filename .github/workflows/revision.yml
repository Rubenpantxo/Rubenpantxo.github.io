name: Revisión

# Solo revisa: nunca despliega. GitHub Pages sigue publicando desde `main`
# en modo legacy, igual que hasta ahora.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  fugas:
    name: fugas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar gitleaks (release oficial, versión fijada)
        run: |
          set -eu
          cd /tmp
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Revisar (bloque fugas)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/revisar.mjs --diff "origin/${{ github.base_ref }}" --bloque fugas
          else
            node scripts/revisar.mjs --all --bloque fugas
          fi

  sanidad:
    name: sanidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar (bloque sanidad)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/revisar.mjs --diff "origin/${{ github.base_ref }}" --bloque sanidad
          else
            node scripts/revisar.mjs --all --bloque sanidad
          fi
