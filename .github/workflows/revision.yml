name: Revisión

# Solo revisa: nunca despliega. GitHub Pages sigue publicando desde `main`
# en modo legacy, igual que hasta ahora.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  fugas:
    name: fugas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Instalar gitleaks (release oficial, versión fijada)
        run: |
          set -eu
          cd /tmp
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Revisar (bloque fugas)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/revisar.mjs --diff "origin/${{ github.base_ref }}" --bloque fugas
          else
            node scripts/revisar.mjs --all --bloque fugas
          fi

  pruebas:
    name: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Servidor del Instagram Downloader (yt-dlp falso, sin internet)
        run: npm test

  compilados:
    name: compilados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # biblioteca.js, biblioteca.css y el Tailwind incrustado del Instagram
      # Downloader se generan desde su fuente: si alguien edita la fuente y no
      # recompila (o edita el generado a mano), esto falla.
      - name: Recompilar y comparar
        run: |
          npm ci --no-fund --no-audit
          npm run build
          git diff --exit-code -- apps/biblioteca/biblioteca.js apps/biblioteca/biblioteca.css apps/instagram-downloader/index_insta_down.html \
            || { echo "::error::Los archivos generados no coinciden con su fuente. Ejecuta npm run build y sube el resultado."; exit 1; }

  sanidad:
    name: sanidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Revisar (bloque sanidad)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/revisar.mjs --diff "origin/${{ github.base_ref }}" --bloque sanidad
          else
            node scripts/revisar.mjs --all --bloque sanidad
          fi
