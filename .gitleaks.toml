title = "gitleaks — Rubenpantxo.github.io"

# Extiende las reglas por defecto de gitleaks; solo se añaden excepciones.
[extend]
useDefault = true

[allowlist]
description = "Excepciones conocidas y no sensibles para este repo"
paths = [
    '''^\.git/''',
    '''node_modules/''',
]
regexes = [
    # access_key de Web3Forms (index.html) y el marcador que ocupaba su sitio.
    # La propia Web3Forms la llama "public key" y la documenta para usarla en
    # codigo de cliente: solo permite enviar un correo a la direccion dueña del
    # formulario, no leer envios ni tocar la cuenta. No es un secreto en el
    # sentido de la auditoria, pero se declara aqui para que ningun cambio de
    # reglas futuro la empiece a marcar en cada revision.
    '''b8e6ddd6-0aaf-4a87-9718-bd971f811088''',
    '''TU_CLAVE_DE_WEB3FORMS_AQUI''',

    # Nombres de archivo de imagen. La regla generica-api-key salta con las
    # portadas de la biblioteca (p. ej. "el-secreto-de-helena.jpg": la palabra
    # "secreto" y una cadena larga). Un nombre de archivo no autentica nada.
    '''[A-Za-z0-9_.-]+\.(?:jpe?g|png|webp|gif|svg|avif)''',

    # Clave de localStorage del Tekken de barrio: nombra un hueco del
    # navegador del visitante, no da acceso a nada.
    '''tekken-barrio-save-v1''',
]
