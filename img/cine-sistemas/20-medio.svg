<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <title>Capa 20 — mesa de trabajo: rejillas de muestras y especimenes tipograficos</title>
  <defs>
    <linearGradient id="m-mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f18"/>
      <stop offset="1" stop-color="#12160f"/>
    </linearGradient>
    <linearGradient id="m-luz" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mesa larga que cruza toda la escena y sale por los dos lados. -->
  <path d="M-240 1470 L4080 1400 L4080 1560 L-240 1650 Z" fill="url(#m-mesa)"/>
  <path d="M-240 1470 L4080 1400 L4080 1442 L-240 1512 Z" fill="#ffffff" opacity="0.07"/>

  <!-- Rejilla de muestras: los acentos reales de los seis sistemas. -->
  <g transform="translate(300 1010)">
    <rect x="-40" y="-48" width="900" height="470" rx="20" fill="#12160f" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
    <g>
      <rect x="0" y="0" width="190" height="150" rx="12" fill="#a3e635"/>
      <rect x="222" y="0" width="190" height="150" rx="12" fill="#b34a1f"/>
      <rect x="444" y="0" width="190" height="150" rx="12" fill="#e7335a"/>
      <rect x="666" y="0" width="150" height="150" rx="12" fill="#a4262c"/>
      <rect x="0" y="182" width="190" height="150" rx="12" fill="#c8f04c"/>
      <rect x="222" y="182" width="190" height="150" rx="12" fill="#1f9d55"/>
      <rect x="444" y="182" width="190" height="150" rx="12" fill="#3a423a"/>
      <rect x="666" y="182" width="150" height="150" rx="12" fill="#f2f5f0"/>
    </g>
    <g fill="#ffffff" opacity="0.16">
      <rect x="0" y="358" width="120" height="10" rx="5"/>
      <rect x="222" y="358" width="120" height="10" rx="5"/>
      <rect x="444" y="358" width="120" height="10" rx="5"/>
      <rect x="666" y="358" width="100" height="10" rx="5"/>
    </g>
  </g>

  <!-- Especimen tipografico: bloques de linea, nunca letras quemadas. -->
  <g transform="translate(2660 940)">
    <rect x="-44" y="-52" width="960" height="560" rx="20" fill="#12160f" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
    <rect x="0" y="0" width="620" height="58" rx="8" fill="#f2f5f0" opacity="0.82"/>
    <rect x="0" y="86" width="800" height="34" rx="6" fill="#f2f5f0" opacity="0.42"/>
    <rect x="0" y="140" width="742" height="34" rx="6" fill="#f2f5f0" opacity="0.42"/>
    <g fill="#f2f5f0" opacity="0.2">
      <rect x="0" y="216" width="860" height="16" rx="8"/>
      <rect x="0" y="252" width="820" height="16" rx="8"/>
      <rect x="0" y="288" width="870" height="16" rx="8"/>
      <rect x="0" y="324" width="640" height="16" rx="8"/>
    </g>
    <g opacity="0.5">
      <rect x="0" y="390" width="64" height="64" rx="10" fill="#a3e635"/>
      <rect x="82" y="390" width="64" height="64" rx="10" fill="#ffffff" opacity="0.18"/>
      <rect x="164" y="390" width="64" height="64" rx="10" fill="#ffffff" opacity="0.12"/>
    </g>
  </g>

  <!-- Patron de trama: la "P" de patrones, como retal apoyado en la mesa. -->
  <g transform="translate(1560 1128)">
    <defs>
      <pattern id="m-trama" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <line x1="0" y1="0" x2="0" y2="56" stroke="#f2f5f0" stroke-opacity="0.5" stroke-width="14"/>
      </pattern>
    </defs>
    <rect width="620" height="330" rx="16" fill="#12160f" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
    <rect x="24" y="24" width="572" height="282" rx="10" fill="url(#m-trama)" opacity="0.35"/>
  </g>

  <rect x="-240" y="820" width="4320" height="860" fill="url(#m-luz)"/>
</svg>
