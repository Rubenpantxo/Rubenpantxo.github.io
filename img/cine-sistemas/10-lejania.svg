<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <title>Capa 10 — paneles de interfaz lejanos apoyados en la pared del estudio</title>
  <defs>
    <linearGradient id="l-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e26"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
  </defs>

  <!-- Sangrado: los paneles de los extremos salen del lienzo. -->
  <g opacity="0.92">
    <!-- panel muy lejano izquierda -->
    <g transform="translate(-160 470)">
      <rect width="640" height="880" rx="18" fill="url(#l-panel)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>
      <rect x="52" y="60" width="330" height="18" rx="9" fill="#ffffff" opacity="0.10"/>
      <rect x="52" y="104" width="210" height="14" rx="7" fill="#ffffff" opacity="0.06"/>
      <g fill="#ffffff" opacity="0.05">
        <rect x="52" y="180" width="536" height="150" rx="12"/>
        <rect x="52" y="356" width="536" height="150" rx="12"/>
        <rect x="52" y="532" width="536" height="150" rx="12"/>
      </g>
    </g>

    <!-- panel lejano centro-izquierda -->
    <g transform="translate(640 620)">
      <rect width="520" height="720" rx="16" fill="url(#l-panel)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>
      <g fill="#ffffff" opacity="0.06">
        <rect x="44" y="52" width="180" height="180" rx="90"/>
        <rect x="252" y="70" width="220" height="16" rx="8"/>
        <rect x="252" y="106" width="150" height="12" rx="6"/>
        <rect x="44" y="272" width="432" height="12" rx="6"/>
        <rect x="44" y="308" width="380" height="12" rx="6"/>
        <rect x="44" y="344" width="410" height="12" rx="6"/>
      </g>
      <rect x="44" y="430" width="240" height="64" rx="32" fill="#ffb547" opacity="0.14"/>
    </g>

    <!-- panel lejano centro-derecha -->
    <g transform="translate(2560 540)">
      <rect width="580" height="800" rx="18" fill="url(#l-panel)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>
      <g opacity="0.10">
        <rect x="48" y="56" width="484" height="240" rx="12" fill="#6ea8ff"/>
      </g>
      <g fill="#ffffff" opacity="0.06">
        <rect x="48" y="330" width="300" height="16" rx="8"/>
        <rect x="48" y="368" width="420" height="12" rx="6"/>
        <rect x="48" y="402" width="360" height="12" rx="6"/>
      </g>
      <g opacity="0.12">
        <rect x="48" y="470" width="140" height="52" rx="26" fill="#ffb547"/>
        <rect x="204" y="470" width="140" height="52" rx="26" fill="#ffffff" opacity="0.4"/>
      </g>
    </g>

    <!-- panel muy lejano derecha, sale del lienzo -->
    <g transform="translate(3260 430)">
      <rect width="740" height="920" rx="20" fill="url(#l-panel)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>
      <g fill="#ffffff" opacity="0.05">
        <rect x="56" y="72" width="300" height="18" rx="9"/>
        <rect x="56" y="150" width="620" height="120" rx="12"/>
        <rect x="56" y="298" width="620" height="120" rx="12"/>
        <rect x="56" y="446" width="620" height="120" rx="12"/>
      </g>
    </g>
  </g>

  <!-- Base comun: sombra donde los paneles tocan el suelo. -->
  <rect x="-200" y="1330" width="4240" height="26" fill="#000000" opacity="0.35"/>
</svg>
