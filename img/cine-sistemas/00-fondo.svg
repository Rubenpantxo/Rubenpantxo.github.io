<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <title>Capa 00 — fondo opaco del estudio, luz halogena arriba a la derecha</title>
  <defs>
    <linearGradient id="f-suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="0.58" stop-color="#12141a"/>
      <stop offset="0.62" stop-color="#181b22"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <radialGradient id="f-halo" cx="0.74" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#ff9d2e" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-frio" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#6ea8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="f-rejilla" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0 L0 0 0 120" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#f-suelo)"/>
  <rect width="3840" height="2160" fill="url(#f-rejilla)"/>
  <rect width="3840" height="2160" fill="url(#f-frio)"/>

  <!-- Linea de horizonte al 62 %: separa pared y suelo del estudio. -->
  <rect x="0" y="1338" width="3840" height="3" fill="#ffffff" opacity="0.07"/>

  <!-- Derrame de la luz sobre el suelo, alineado con el foco halogeno. -->
  <path d="M2280 1338 L3320 1338 L3840 2160 L1740 2160 Z" fill="#ffb547" opacity="0.055"/>

  <rect width="3840" height="2160" fill="url(#f-halo)"/>
</svg>
