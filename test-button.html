<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { background: #0b1115; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .dl-container { display: flex; flex-direction: column; align-items: center; width: 300px; }
  
  .status-text { color: #5c747a; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; transition: color 0.3s; }
  .status-text.complete { color: #5c747a; }

  .graphics { position: relative; width: 200px; height: 80px; display: flex; align-items: center; justify-content: center; }
  
  .rail { stroke: #1a2a30; stroke-width: 4; stroke-linecap: round; fill: none; transition: stroke-dashoffset 0.1s linear; }
  .rail--fill { stroke: #00f0ff; filter: drop-shadow(0 0 8px rgba(0,240,255,0.6)); stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  
  .icon { position: absolute; top: 10px; width: 40px; height: 40px; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; }
  .icon path { stroke: #00f0ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 6px rgba(0,240,255,0.6)); }

  .percent { color: #5c747a; font-size: 14px; margin-top: 20px; font-variant-numeric: tabular-nums; }
  .filename { color: #5c747a; font-size: 12px; margin-top: 40px; }
  
  .btn { appearance: none; background: transparent; border: 2px solid #00f0ff; color: #00f0ff; border-radius: 8px; padding: 12px 24px; cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0,240,255,0.2); transition: all 0.2s; }
  .btn:hover { background: rgba(0,240,255,0.1); box-shadow: 0 0 20px rgba(0,240,255,0.4); }

  /* States */
  .dl-container[data-state="idle"] .progress-ui { display: none; }
  .dl-container:not([data-state="idle"]) .btn { display: none; }

  .dl-container[data-state="downloading"] .icon.check { opacity: 0; transform: translateY(-20px) scale(0.5); }
  .dl-container[data-state="downloading"] .icon.arrow { opacity: 1; transform: translateY(0) scale(1); animation: bounce 1s infinite alternate; }

  .dl-container[data-state="complete"] .icon.arrow { opacity: 0; transform: translateY(20px) scale(0.5); }
  .dl-container[data-state="complete"] .icon.check { opacity: 1; transform: translateY(0) scale(1); }
  .dl-container[data-state="complete"] .status-text { color: #00f0ff; text-shadow: 0 0 8px rgba(0,240,255,0.4); }

  @keyframes bounce {
    from { transform: translateY(-5px); }
    to { transform: translateY(5px); }
  }
</style>
</head>
<body>
  <div class="dl-container" id="dl" data-state="idle">
    <button class="btn" id="start">Download Video</button>
    <div class="progress-ui" style="display:flex; flex-direction:column; align-items:center;">
      <div class="status-text" id="st">Downloading</div>
      <div class="graphics">
        <!-- The unrolling ring/line. Let's approximate it with an SVG line for now -->
        <svg width="200" height="80" viewBox="0 0 200 80" style="position: absolute; bottom: 0;">
          <path d="M 10,70 L 190,70" class="rail" />
          <path d="M 10,70 L 190,70" class="rail rail--fill" pathLength="1" id="fill" />
        </svg>
        <svg class="icon arrow" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6" /></svg>
        <svg class="icon check" viewBox="0 0 24 24" style="opacity: 0;"><path d="M4 12l5 5 11-11" /></svg>
      </div>
      <div class="percent" id="pct">0%</div>
      <div class="filename">video.mp4 <span id="size"></span></div>
    </div>
  </div>
  <script>
    const dl = document.getElementById('dl');
    const fill = document.getElementById('fill');
    const pct = document.getElementById('pct');
    const st = document.getElementById('st');

    document.getElementById('start').addEventListener('click', () => {
      dl.dataset.state = 'downloading';
      st.textContent = 'Downloading';
      let p = 0;
      const int = setInterval(() => {
        p += Math.random() * 0.05;
        if(p > 1) p = 1;
        fill.style.strokeDashoffset = 1 - p;
        pct.textContent = Math.floor(p * 100) + '%';
        if(p === 1) {
          clearInterval(int);
          dl.dataset.state = 'complete';
          st.textContent = 'Complete';
        }
      }, 100);
    });
  </script>
</body>
</html>
