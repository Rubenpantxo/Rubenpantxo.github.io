            /* ================= LIBRERÍA: rejilla y tarjetas ================= */
            /* Nada de esto debe alterar el layout al pasar el ratón: las
               tarjetas tienen altura fija y solo se anima transform. */

            .library-root { position: relative; min-height: 100vh; }

            .books-grid {
                display: grid;
                column-gap: 1rem;
                row-gap: 1.75rem;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            @media (min-width: 640px)  { .books-grid { grid-template-columns: repeat(3, minmax(0,1fr)); column-gap: 1.25rem; row-gap: 2rem; } }
            @media (min-width: 768px)  { .books-grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
            @media (min-width: 1024px) { .books-grid { grid-template-columns: repeat(5, minmax(0,1fr)); } }
            @media (min-width: 1280px) { .books-grid { grid-template-columns: repeat(6, minmax(0,1fr)); } }

            .book-card {
                position: relative;
                display: block;
                width: 100%;
                padding: 0;
                border: 0;
                background: none;
                color: inherit;
                font: inherit;
                text-align: left;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }
            .book-card__inner {
                display: block;
                transform: translate3d(0, 0, 0);
                transition: transform .3s cubic-bezier(.22,.61,.36,1), filter .3s ease;
                will-change: transform;
            }
            /* Solo el libro señalado se mueve. Nunca cambia el flujo. */
            @media (hover: hover) and (pointer: fine) {
                .book-card:hover  { z-index: 5; }
                .book-card:hover  .book-card__inner,
                .book-card:focus-visible .book-card__inner {
                    transform: translate3d(0, -8px, 0) scale(1.045);
                }
                .book-card:hover .book-card__cover { box-shadow: 0 18px 32px -14px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.06); }
            }
            .book-card:focus-visible { outline: 2px solid var(--cat, #fff); outline-offset: 4px; border-radius: .5rem; }
            .book-card:active .book-card__inner { transform: translate3d(0, -3px, 0) scale(.985); }

            .book-card__cover {
                position: relative;
                display: block;
                aspect-ratio: 2 / 3;
                border-radius: .2rem .45rem .45rem .2rem;
                overflow: hidden;
                background: #16181d;
                box-shadow: 0 10px 22px -14px rgba(0,0,0,.95), 0 1px 4px rgba(0,0,0,.6);
                transition: box-shadow .3s ease, opacity .3s ease;
            }
            .cover-img { display: block; width: 100%; height: 100%; object-fit: cover; }

            .cover-fallback {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: .4rem;
                padding: 11% 9%;
                background-color: var(--cat, #555);
                background-image: linear-gradient(155deg, rgba(255,255,255,.22), rgba(255,255,255,0) 42%, rgba(0,0,0,.42) 100%);
            }
            .cover-fallback::before {
                content: "";
                position: absolute;
                inset: 6% 5%;
                border: 1px solid currentColor;
                opacity: .3;
                border-radius: 2px;
                pointer-events: none;
            }
            .cover-fallback__title {
                position: relative;
                font-weight: 800;
                font-size: clamp(.6rem, 1.45vw, .95rem);
                line-height: 1.14;
                letter-spacing: -.01em;
                display: -webkit-box;
                -webkit-line-clamp: 6;
                -webkit-box-orient: vertical;
                overflow: hidden;

            .cover-fallback__author {

                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;

            .book-card__spine {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: 8%;
                background: linear-gradient(90deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.22) 55%, rgba(255,255,255,.05) 100%);
                pointer-events: none;

            .book-card__band {
                position: absolute;

                background: var(--cat, #888);

            .book-card__meta {
                display: block;

                backdrop-filter: blur(7px);
                cursor: zoom-out;
                animation: b3dFade .3s ease both;
            }
            .book3d-dialog {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.25rem;
                width: 100%;
                max-width: 60rem;
                max-height: 100%;
                overflow-y: auto;
                overscroll-behavior: contain;
                padding: .5rem;
            }
            @media (min-width: 900px) {
                .book3d-dialog { flex-direction: row; align-items: center; justify-content: center; gap: 2.75rem; }
            }

            .book3d-stage {
                position: relative;
                flex: 0 0 auto;
                perspective: 1500px;
                perspective-origin: 50% 44%;
                padding: 2rem 1rem 2.75rem;
            }
            .book3d-wrap {
                transform-style: preserve-3d;
                animation: b3dEnter .95s cubic-bezier(.2,.68,.3,1) both;
            }
            .book3d {
                --bw: clamp(140px, 40vw, 232px);
                --bh: calc(var(--bw) * 1.48);
                --bd: clamp(18px, 5vw, 34px);
                position: relative;
                width: var(--bw);
                height: var(--bh);
                transform-style: preserve-3d;
                transform: rotateX(7deg) rotateY(-26deg);
                transition: transform .85s cubic-bezier(.22,.61,.36,1);
                will-change: transform;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }
            .book3d.is-back { transform: rotateX(7deg) rotateY(-206deg); }

            .book3d-floor {
                position: absolute;
                left: 50%;
                bottom: .9rem;
                width: clamp(150px, 42vw, 250px);
                height: 22px;
                transform: translateX(-50%);
                background: radial-gradient(ellipse at center, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 70%);
                filter: blur(3px);
                pointer-events: none;
            }

            .b3d-face {
                position: absolute;
                left: 50%;
                top: 50%;
                overflow: hidden;
                backface-visibility: hidden;
                -webkit-backface-visibility: hidden;
            }
            .b3d-front, .b3d-back { width: var(--bw); height: var(--bh); }
            .b3d-front {
                transform: translate(-50%, -50%) translateZ(calc(var(--bd) / 2));
                border-radius: 2px 6px 6px 2px;
                box-shadow: inset 0 0 0 1px rgba(0,0,0,.4);
            }
            .b3d-front::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(105deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,0) 32%, rgba(0,0,0,.28) 100%);
                pointer-events: none;
            }
            .b3d-back {
                transform: translate(-50%, -50%) rotateY(180deg) translateZ(calc(var(--bd) / 2));
                border-radius: 6px 2px 2px 6px;
                background-color: var(--cat, #444);
                background-image: linear-gradient(200deg, rgba(0,0,0,.45), rgba(0,0,0,.05));
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 12% 10%;
            }
            .b3d-back__text { font-size: clamp(.55rem, 1.5vw, .74rem); line-height: 1.35; opacity: .9; }
            .b3d-back__mark { font-size: clamp(.5rem, 1.3vw, .64rem); letter-spacing: .12em; text-transform: uppercase; opacity: .65; }

            .b3d-spine {
                width: var(--bd);
                height: var(--bh);
                transform: translate(-50%, -50%) rotateY(-90deg) translateZ(calc(var(--bw) / 2));
                background-color: var(--cat, #444);
                background-image: linear-gradient(90deg, rgba(0,0,0,.5), rgba(255,255,255,.12) 45%, rgba(0,0,0,.45));
                display: flex;
                align-items: center;
                justify-content: center;
                padding: .5rem .1rem;
                border-radius: 2px 0 0 2px;
            }
            .b3d-spine__text {
                writing-mode: vertical-rl;
                text-orientation: mixed;
                font-size: clamp(.42rem, 1.25vw, .62rem);
                font-weight: 800;
                letter-spacing: .04em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-height: 100%;
            }
            .b3d-edge {
                width: var(--bd);
                height: var(--bh);
                transform: translate(-50%, -50%) rotateY(90deg) translateZ(calc(var(--bw) / 2));
                background-color: #efe8d8;
                background-image: repeating-linear-gradient(to right, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px 3px);
                box-shadow: inset -6px 0 10px -6px rgba(0,0,0,.55);
                border-radius: 0 3px 3px 0;
            }
            .b3d-top, .b3d-bottom {
                width: var(--bw);
                height: var(--bd);
                background-color: #efe8d8;
                background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,.14) 0 1px, rgba(0,0,0,0) 1px 3px);
            }
            .b3d-top    { transform: translate(-50%, -50%) rotateX(90deg)  translateZ(calc(var(--bh) / 2)); }
            .b3d-bottom { transform: translate(-50%, -50%) rotateX(-90deg) translateZ(calc(var(--bh) / 2)); box-shadow: inset 0 -6px 10px -6px rgba(0,0,0,.6); }

            .book3d-info {
                flex: 1 1 20rem;
                min-width: 0;
                max-width: 30rem;
                background: rgba(16,18,23,.88);
                border: 1px solid rgba(255,255,255,.09);
                border-radius: 1rem;
                padding: 1.35rem 1.4rem;
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
                box-shadow: 0 30px 60px -30px rgba(0,0,0,.9);
                animation: b3dInfo .5s .15s cubic-bezier(.2,.68,.3,1) both;
            }
            .book3d-info__kicker {
                display: inline-flex;
                align-items: center;
                gap: .45rem;
                font-size: .68rem;
                font-weight: 700;
                letter-spacing: .14em;
                text-transform: uppercase;
                color: var(--cat, #ccc);
            }
            .book3d-info__kicker::before {
                content: "";
                width: .55rem; height: .55rem;
                border-radius: 50%;
                background: var(--cat, #ccc);
                box-shadow: 0 0 10px var(--cat, #ccc);
            }
            .book3d-info__title { margin-top: .5rem; font-size: clamp(1.2rem, 3.4vw, 1.65rem); font-weight: 800; line-height: 1.15; color: #f3f4f7; }
            .book3d-info__author { margin-top: .3rem; font-size: .95rem; color: #a9b0bd; }
            .book3d-facts { margin-top: 1.1rem; display: grid; grid-template-columns: auto 1fr; gap: .45rem .9rem; font-size: .82rem; }
            .book3d-facts dt { color: #7f8794; font-weight: 600; }
            .book3d-facts dd { color: #dfe2e8; margin: 0; overflow-wrap: anywhere; }
            .book3d-actions { margin-top: 1.35rem; display: flex; flex-wrap: wrap; gap: .6rem; }
            .book3d-btn {
                border: 1px solid rgba(255,255,255,.16);
                background: rgba(255,255,255,.06);
                color: #e8eaf0;
                border-radius: .6rem;
                padding: .5rem .95rem;
                font-size: .82rem;
                font-weight: 600;
                cursor: pointer;
                transition: background .2s ease, border-color .2s ease;
            }
            .book3d-btn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
            .book3d-btn--primary { border-color: var(--cat, #888); color: var(--cat, #ddd); }
            .book3d-hint { margin-top: .8rem; font-size: .7rem; color: #6f7783; }

            @keyframes b3dFade { from { opacity: 0 } to { opacity: 1 } }
            @keyframes b3dInfo { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
            @keyframes b3dEnter {
                from { opacity: 0; transform: translate3d(-18%, 8%, -320px) rotateY(-62deg) scale(.82); }
                55%  { opacity: 1; }
                to   { opacity: 1; transform: translate3d(0, 0, 0) rotateY(0deg) scale(1); }
            }

            /* Versión sin giro para quien prefiere menos movimiento */
            @media (prefers-reduced-motion: reduce) {
                .book-card__inner { transition: none; }
                .book-card:hover .book-card__inner,
                .book-card:focus-visible .book-card__inner { transform: none; }
                .book3d-wrap { animation: none; }
                .book3d-backdrop, .book3d-info { animation: none; }
                .book3d { transition: none; transform: none; }
                .book3d.is-back { transform: rotateY(180deg); }
                .book3d-floor { display: none; }
            }
        `;

        // --- HELPERS DE PORTADA ---

        const COVER_BASE = '../../img/Libros/portadas/';

        const hexToRgb = (hex) => {
            const h = String(hex || '#888888').replace('#', '');
            const f = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
            return [
                parseInt(f.slice(0, 2), 16) || 0,
                parseInt(f.slice(2, 4), 16) || 0,
                parseInt(f.slice(4, 6), 16) || 0
            ];
        };

        // Tinta legible sobre el color del género (portada de respaldo)
        const readableOn = (hex) => {
            const [r, g, b] = hexToRgb(hex);
            const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
            return lum > 0.55 ? '#111318' : '#f6f4ef';
        };

        const coverFileFor = (catId, book) => {
            const map = COVERS[catId];
            return (map && map[book.title]) || null;
        };

        // Portada real si existe; si no, portada generada por CSS con el color del género
        const CoverArt = ({ book, color, file, variant }) => {
            const [failed, setFailed] = useState(false);
            const useImage = Boolean(file) && !failed;

            if (useImage) {
                return (
                    <img
                        className="cover-img"
                        src={COVER_BASE + file}
                        alt={'Portada de ' + book.title}
                        loading={variant === 'card' ? 'lazy' : 'eager'}
                        decoding="async"
                        draggable="false"
                        onError={() => setFailed(true)}
                    />
                );
            }

            return (
                <span className="cover-fallback" style={{ '--cat': color, color: readableOn(color) }}>
                    <span className="cover-fallback__title">{book.title}</span>
                    <span className="cover-fallback__author">{book.author}</span>
                </span>
            );
        };

        // --- COMPONENTS ---

        const CategoryCard = ({ category, onClick }) => {
            return (
                <button
                    onClick={() => onClick(category)}
                    className="group relative w-full h-32 md:h-40 rounded-xl transition-all duration-300 transform hover:-translate-y-1 active:scale-95 flex items-center justify-center overflow-hidden backdrop-blur-sm"
                    style={{
                        backgroundColor: 'transparent',
                        borderColor: category.color,
                        borderWidth: '2px',
                        color: category.color,
                        boxShadow: `0 0 10px -5px ${category.color}`
                    }}
                >
                    <div className="z-10 text-center px-4">
                        <h3 className="text-xl md:text-2xl font-bold uppercase tracking-wider font-mono drop-shadow-md">
                            {category.name}
                        </h3>
                    </div>

                    <div
                        className="absolute inset-0 transition-opacity duration-300 opacity-0 group-hover:opacity-10"
                        style={{ backgroundColor: category.color }}
                    />
                </button>
            );
        };

        // Ejemplar en la estantería. Al pasar el ratón SOLO se transforma este
        // elemento (transform + will-change): ni el fondo, ni la rejilla, ni el
        // resto de libros cambian de sitio porque nada altera el flujo.
        const BookItem = ({ book, color, file, isOpen, onSelect }) => {
            return (
                <button
                    type="button"
                    className={'book-card' + (isOpen ? ' is-open' : '')}
                    style={{ '--cat': color }}
                    aria-label={'Ver ficha de ' + book.title + ', de ' + book.author}
                    onClick={onSelect}
                >
                    <span className="book-card__inner">
                        <span className="book-card__cover">
                            <CoverArt book={book} color={color} file={file} variant="card" />
                            <span className="book-card__spine" aria-hidden="true"></span>
                            <span className="book-card__band" aria-hidden="true"></span>
                        </span>
                        <span className="book-card__meta">
                            <span className="book-card__title">{book.title}</span>
                            <span className="book-card__author">{book.author}</span>
                        </span>
                    </span>
                </button>
            );
        };

        // Campos opcionales: si algún día los libros guardan más datos,
        // la ficha los muestra sola sin tocar el componente.
        const EXTRA_FIELDS = [
            ['year', 'Año'], ['anio', 'Año'], ['año', 'Año'],
            ['publisher', 'Editorial'], ['editorial', 'Editorial'],
            ['edition', 'Edición'], ['edicion', 'Edición'],
            ['isbn', 'ISBN'],
            ['pages', 'Páginas'], ['paginas', 'Páginas'],
            ['language', 'Idioma'], ['idioma', 'Idioma'],
            ['saga', 'Saga'], ['series', 'Saga'],
            ['status', 'Estado de lectura'], ['estado', 'Estado de lectura'], ['leido', 'Estado de lectura'],
            ['rating', 'Valoración'], ['valoracion', 'Valoración'],
            ['location', 'Ubicación'], ['ubicacion', 'Ubicación'], ['balda', 'Balda'],
            ['notes', 'Notas'], ['notas', 'Notas']
        ];

        // Ficha en 3D: el ejemplar sale del estante y gira mostrando su portada.
        const Book3DModal = ({ book, category, file, index, total, onClose }) => {
            const [showBack, setShowBack] = useState(false);
            const closeRef = useRef(null);

            useEffect(() => {
                const root = document.documentElement;
                root.classList.add('b3d-open');
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onKey);
                if (closeRef.current) closeRef.current.focus();
                return () => {
                    root.classList.remove('b3d-open');
                    document.removeEventListener('keydown', onKey);
                };
            }, [onClose]);

            const extras = EXTRA_FIELDS.filter(
                ([key]) => book[key] !== undefined && book[key] !== null && String(book[key]).trim() !== ''
            );
            const seen = {};

            return (
                <div className="book3d-overlay" role="dialog" aria-modal="true" aria-label={'Ficha de ' + book.title}>
                    <button className="book3d-backdrop" aria-label="Cerrar ficha" onClick={onClose}></button>

                    <div className="book3d-dialog" style={{ '--cat': category.color }}>
                        <div className="book3d-stage">
                            <div className="book3d-wrap">
                                <div
                                    className={'book3d' + (showBack ? ' is-back' : '')}
                                    style={{ '--cat': category.color, color: readableOn(category.color) }}
                                    onClick={() => setShowBack((v) => !v)}
                                    role="button"
                                    tabIndex={0}
                                    aria-label={showBack ? 'Ver la portada' : 'Ver la contraportada'}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setShowBack((v) => !v); }
                                    }}
                                >
                                    <div className="b3d-face b3d-front">
                                        <CoverArt book={book} color={category.color} file={file} variant="hero" />
                                    </div>
                                    <div className="b3d-face b3d-back">
                                        <span className="b3d-back__text">{book.title}</span>
                                        <span className="b3d-back__mark">Biblioteca · {category.name}</span>
                                    </div>
                                    <div className="b3d-face b3d-spine">
                                        <span className="b3d-spine__text">{book.title}</span>
                                    </div>
                                    <div className="b3d-face b3d-edge"></div>
                                    <div className="b3d-face b3d-top"></div>
                                    <div className="b3d-face b3d-bottom"></div>
                                </div>
                            </div>
                            <div className="book3d-floor" aria-hidden="true"></div>
                        </div>

                        <div className="book3d-info" style={{ '--cat': category.color }}>
                            <span className="book3d-info__kicker">{category.name}</span>
                            <h3 className="book3d-info__title">{book.title}</h3>
                            <p className="book3d-info__author">{book.author}</p>

                            <dl className="book3d-facts">
                                <dt>Género</dt>
                                <dd>{category.name}</dd>
                                <dt>Autor</dt>
                                <dd>{book.author}</dd>
                                {extras.map(([key, label]) => {
                                    if (seen[label]) return null;
                                    seen[label] = true;
                                    return (
                                        <React.Fragment key={key}>
                                            <dt>{label}</dt>
                                            <dd>{String(book[key])}</dd>
                                        </React.Fragment>
                                    );
                                })}
                                <dt>En el estante</dt>
                                <dd>Ejemplar {index + 1} de {total}</dd>
                                <dt>Balda</dt>
                                <dd>{category.name} · {category.label}</dd>
                                <dt>Portada</dt>
                                <dd>{file ? 'Archivo local (Open Library)' : 'Generada con el color del género'}</dd>
                            </dl>

                            <div className="book3d-actions">
                                <button
                                    type="button"
                                    className="book3d-btn book3d-btn--primary"
                                    onClick={() => setShowBack((v) => !v)}
                                >
                                    {showBack ? 'Ver portada' : 'Girar el libro'}
                                </button>
                                <button type="button" className="book3d-btn" ref={closeRef} onClick={onClose}>
                                    Devolver al estante
                                </button>
                            </div>
                            <p className="book3d-hint">Toca el libro para girarlo. Pulsa Esc o fuera para cerrarlo.</p>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selected, setSelected] = useState(null); // { index }

            const openCategory = useCallback((cat) => {
                setSelected(null);
                setSelectedCategory(cat);
            }, []);

            const closeBook = useCallback(() => setSelected(null), []);

            const list = selectedCategory ? (BOOKS[selectedCategory.id] || []) : [];
            const openBook = selected ? list[selected.index] : null;

            return (
                <>
                    <style>{FLASHLIGHT_CSS}</style>

                    <div className="library-root font-sans text-gray-100">

                        {/* Fondo de estantería: capa fija propia. Al estar fuera del
                            flujo y anclada al viewport, nunca se mueve por hover ni
                            por cambios de altura del contenido. */}
                        <div className="shelf-bg" aria-hidden="true"></div>

                        <div className="content-wrapper">

                            <header className="p-6 bg-gray-900/60 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800/50">
                                <div className="max-w-7xl mx-auto flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-indigo-600/80 rounded-lg shadow-[0_0_15px_rgba(79,70,229,0.5)]">
                                            <LibraryIcon className="w-6 h-6 text-white" />
                                        </div>
                                        <h1 className="text-2xl font-bold tracking-tight text-white drop-shadow-md">
                                            Gestor de Biblioteca
                                        </h1>
                                    </div>

                                    {selectedCategory && (
                                        <button
                                            onClick={() => { setSelected(null); setSelectedCategory(null); }}
                                            className="flex items-center gap-2 px-4 py-2 bg-gray-800/80 hover:bg-gray-700/80 border border-gray-600 rounded-lg transition-colors text-sm font-medium backdrop-blur-sm"
                                        >
                                            <ArrowLeft className="w-4 h-4" />
                                            Volver a Categorías
                                        </button>
                                    )}
                                </div>
                            </header>

                            <main className="max-w-7xl mx-auto p-4 md:p-8 pb-16">

                                {!selectedCategory ? (
                                    <div>
                                        <h2 className="text-xl text-gray-300 mb-6 font-light drop-shadow-md">Selecciona una categoría para explorar</h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                                            {CATEGORIES.map((cat) => (
                                                <CategoryCard
                                                    key={cat.id}
                                                    category={cat}
                                                    onClick={openCategory}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="mb-8 flex items-baseline gap-4 border-b border-gray-700/50 pb-4">
                                            <h2
                                                className="text-3xl md:text-4xl font-black uppercase"
                                                style={{ color: selectedCategory.color }}
                                            >
                                                {selectedCategory.name}
                                            </h2>
                                            <span className="text-gray-400 font-medium">{list.length} libros</span>
                                        </div>

                                        <div className={'books-grid' + (openBook ? ' is-dimmed' : '')}>
                                            {list.map((book, index) => (
                                                <BookItem
                                                    key={selectedCategory.id + '-' + index}
                                                    book={book}
                                                    color={selectedCategory.color}
                                                    file={coverFileFor(selectedCategory.id, book)}
                                                    isOpen={Boolean(selected) && selected.index === index}
                                                    onSelect={() => setSelected({ index })}
                                                />
                                            ))}

                                            {list.length === 0 && (
                                                <div className="col-span-full text-center py-20 text-gray-500">
                                                    <p>No hay libros registrados en esta categoría aún.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </main>

                            <footer className="fixed bottom-0 left-0 right-0 bg-gray-900/80 backdrop-blur-sm border-t border-gray-800/50 p-2 text-center text-xs text-gray-500 z-40">
                                Sistema de Archivo v1.2
                            </footer>

                        </div>

                        {openBook && (
                            <Book3DModal
                                key={selectedCategory.id + '-' + selected.index}
                                book={openBook}
                                category={selectedCategory}
                                file={coverFileFor(selectedCategory.id, openBook)}
                                index={selected.index}
                                total={list.length}
                                onClose={closeBook}
                            />
                        )}
                    </div>
                </>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
