<!DOCTYPE html>
<html lang="es" data-app="biblioteca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - rubenpantxo.com</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <!-- Todo servido desde el propio sitio: antes React, Babel y Tailwind
         venían de unpkg y cdn.tailwindcss.com sin versión fija (~3,5 MB y
         compilación del JSX en cada visita). Fuente: biblioteca.jsx →
         npm run biblioteca / npm run css:biblioteca -->
    <link rel="stylesheet" href="biblioteca.css">
    <script src="../../js/consentimiento.js"></script>
    <script src="../../js/app.js"></script>
    <script src="vendor/react.production.min.js" defer></script>
    <script src="vendor/react-dom.production.min.js" defer></script>
    <script src="biblioteca.js" charset="utf-8" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Reserva siempre el hueco de la barra: al abrir la ficha 3D
           (que bloquea el scroll) la pagina no da un salto lateral. */
        html { scrollbar-gutter: stable; background: #111; }
        html.b3d-open { overflow: hidden; }
        body { background: #111; color: #e8e9ee; min-height: 100vh; }
        img { max-width: 100%; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
        .biblio-cargando { padding: 30vh 16px 0; text-align: center; font: 16px/1.5 system-ui, sans-serif; color: #9ca3af; }
    </style>
</head>
<body>
    <div id="root">
        <p class="biblio-cargando" role="status">Cargando la biblioteca…</p>
        <noscript><p class="biblio-cargando">La biblioteca necesita JavaScript activado.</p></noscript>
    </div>
</body>
</html>
