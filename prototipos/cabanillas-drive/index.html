<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1b2430" />
    <title>Cabanillas Drive</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2430; }
      #escena { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #panel {
        position: fixed; top: 16px; left: 16px; max-width: calc(100% - 32px); box-sizing: border-box;
        padding: 10px 14px; border-radius: 8px; background: rgba(20, 28, 38, .78);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
        user-select: none;
      }
      #panel h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
      #panel p { margin: 0; color: #c9d3de; }
      #panel button {
        margin-top: 8px; padding: 6px 12px; border: 1px solid #ffe000; border-radius: 6px;
        background: transparent; color: #ffe000; font: inherit; cursor: pointer;
      }
      #panel button[aria-pressed="false"] { border-color: #8a96a3; color: #8a96a3; }
    </style>
  </head>
  <body>
    <canvas id="escena"></canvas>
    <div id="panel">
      <h1>Cabanillas Drive — fase 2</h1>
      <p id="estado">Cargando…</p>
      <p id="comprobacion"></p>
      <button id="botonCalles" type="button" aria-pressed="true">Calles OSM (L)</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
