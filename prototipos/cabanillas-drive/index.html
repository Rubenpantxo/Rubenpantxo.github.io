<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2430" />
    <title>Cabanillas Drive</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2430; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #escena { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #panel {
        position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; max-width: calc(100% - 24px);
        box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: rgba(20, 28, 38, .72);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; pointer-events: none;
      }
      #panel h1 { margin: 0; font-size: 15px; font-weight: 650; }
      #panel p { margin: 0; color: #c9d3de; }
      #panel p:empty { display: none; }
      #velocidad { font-size: 22px; font-weight: 700; color: #fff !important; font-variant-numeric: tabular-nums; }
      #panel button {
        pointer-events: auto; margin-top: 6px; padding: 5px 10px; border: 1px solid #ffe000; border-radius: 6px;
        background: transparent; color: #ffe000; font: inherit; cursor: pointer;
      }
      #panel button[aria-pressed="false"] { border-color: #8a96a3; color: #8a96a3; }
      #ayuda { font-size: 12px; }
      @media (pointer: coarse) { #ayuda .teclado { display: none; } }

      /* Controles táctiles */
      #tactil[hidden] { display: none; }
      .zona-joystick { position: fixed; left: 0; bottom: 0; width: 50%; height: 60%; touch-action: none; }
      .joystick-base {
        position: fixed; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%;
        background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .45); pointer-events: none;
      }
      .joystick-base[hidden] { display: none; }
      .joystick-mando {
        position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255, 255, 255, .7);
      }
      .botones { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
        display: grid; grid-template-columns: auto auto; gap: 12px; align-items: end; }
      .boton-tactil {
        width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55);
        background: rgba(20, 28, 38, .55); color: #fff; font: 600 14px system-ui, sans-serif; touch-action: none;
      }
      .boton-tactil.grande { width: 96px; height: 96px; }
      .boton-tactil.pulsado { background: rgba(255, 224, 0, .55); }
      .boton-tactil.pequeno { width: 52px; height: 52px; font-size: 18px; }
      .botones-superiores { position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
        display: flex; gap: 10px; }
    </style>
  </head>
  <body>
    <canvas id="escena"></canvas>
    <div id="panel">
      <h1>Cabanillas Drive</h1>
      <p id="velocidad"></p>
      <p id="estado">Cargando…</p>
      <p id="ayuda" hidden><span class="teclado">WASD / flechas · Espacio freno de mano · R recolocar · C cámara</span></p>
    </div>
    <div id="tactil" hidden>
      <div class="zona-joystick">
        <div class="joystick-base" hidden><div class="joystick-mando"></div></div>
      </div>
      <div class="botones">
        <button class="boton-tactil" type="button" data-mantener="frenoMano" aria-label="Freno de mano">Mano</button>
        <button class="boton-tactil grande" type="button" data-mantener="acelerador" aria-label="Acelerar">▲</button>
        <span></span>
        <button class="boton-tactil" type="button" data-mantener="freno" aria-label="Frenar o marcha atrás">▼</button>
      </div>
      <div class="botones-superiores">
        <button class="boton-tactil pequeno" type="button" data-pulsar="camara" aria-label="Cambiar cámara">👁</button>
        <button class="boton-tactil pequeno" type="button" data-pulsar="reiniciar" aria-label="Recolocar el coche">↺</button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
