<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1b2430" />
    <title>Cabanillas Drive</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2430; }
      #escena { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #rotulo {
        position: fixed; top: 16px; left: 16px; max-width: calc(100% - 32px); box-sizing: border-box;
        padding: 8px 14px; border-radius: 8px; background: rgba(20, 28, 38, .72);
        font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="escena"></canvas>
    <div id="rotulo">Cabanillas Drive — fase 0</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
